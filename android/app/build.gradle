// Release signing material is machine-local and never committed. See BUILD.md
// "Release signing". Without keystore.properties the release variant simply
// stays unsigned, so a fresh clone still configures successfully.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    hasReleaseKey = keystoreProperties.getProperty("storeFile") != null
}

android {
    namespace = "com.gummygamer.apkpatcher"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.gummygamer.apkpatcher"
        minSdk = 26
        targetSdk = 35
        versionCode = 2
        versionName = "1.1"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProperties.getProperty("storeFile"))
                storeType keystoreProperties.getProperty("storeType", "PKCS12")
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty(
                    "keyPassword", keystoreProperties.getProperty("storePassword"))
                // Distributable identity: v2 for all supported devices, v3 so
                // Android 9+ can rotate the key later without breaking upgrades.
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding = true
    }

    testOptions {
        unitTests.all {
            // Allow access to sun.security.x509 for keystore generation in tests
            jvmArgs(
                "--add-opens", "java.base/sun.security.x509=ALL-UNNAMED",
                "--add-opens", "java.base/sun.security.util=ALL-UNNAMED"
            )
        }
    }
}

